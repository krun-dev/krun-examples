<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>拾光 · Photo Wall</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><a class="brand" href="/" aria-label="拾光首页"><span>✳</span> 拾光 <small>PHOTO WALL</small></a><span class="header-note">A LITTLE SPACE FOR YOUR MOMENTS</span></header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">YOUR LITTLE CORNER OF THE INTERNET <span>✦</span></p><h1>把喜欢的瞬间<br><em>留在这里。</em></h1><p class="intro">一面简单的照片墙，收藏生活里闪闪发光的小事。</p>
        <label class="upload">＋ &nbsp; 上传照片<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p class="hint">JPEG、PNG、WebP、GIF · 最大 5 MB</p>
      </div>
      <div class="art" aria-hidden="true"><div class="art-card"><div class="sun"></div><div class="hill one"></div><div class="hill two"></div><span>GOOD DAYS<br>ARE HERE ☺</span></div><span class="art-star">✳</span><span class="art-caption">A COLLECTION OF LITTLE JOYS ↗</span></div>
    </section>
    <section class="collection"><div class="section-title"><div><p class="eyebrow">THE COLLECTION</p><h2>生活切片 <span>✳</span></h2></div><p>慢慢收集，好好珍藏。</p></div>
      <p id="status" role="status" aria-live="polite">正在加载照片…</p><div id="photos" class="grid"></div><button id="more" class="more" hidden>加载更多 ↓</button>
    </section>
  </main>
  <footer><span>✳ 拾光 PHOTO WALL</span><span>MADE FOR THE LITTLE MOMENTS.</span></footer>
</body>
</html>
